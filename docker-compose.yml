services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "3900:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smb_intelligence?schema=public
      - AUTH_SECRET=${AUTH_SECRET:-dev-secret-change-in-production-abc123xyz789}
      - AUTH_URL=${AUTH_URL:-https://smb.cmaclab.com}
      - NEXTAUTH_URL_INTERNAL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - NODE_ENV=development
      # Playwright needs this to find its browser binaries
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    # Shared memory for Chromium (prevents crashes in Docker)
    shm_size: '512mb'
    # Explicit DNS servers to avoid Docker DNS flakiness with provider sites
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma generate && npx prisma db push && npx ts-node --compiler-options '{\"module\":\"CommonJS\"}' scripts/migrate-to-shared-settings.ts && npm run dev"

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smb_intelligence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
